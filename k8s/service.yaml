apiVersion: v1
kind: Service
metadata:
  name: tcp-proxy-service
  labels:
    app: tcp-proxy
spec:
  type: LoadBalancer
  loadBalancerIP: 136.114.131.74
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: tcp-proxy
